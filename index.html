<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f8f5">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="card-header">
        <p class="eyebrow">把想做的事，一件件完成</p>
        <div class="header-main">
          <h1 id="page-title">待辦清單</h1>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span aria-hidden="true">🌙</span>
            <span>深色模式</span>
          </button>
        </div>
      </header>

      <form class="add-form" id="todo-form">
        <label class="visually-hidden" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="接下來要做什麼？"
          autocomplete="off"
          maxlength="200"
        >
        <button class="add-button" type="submit">
          <span aria-hidden="true">＋</span>
          新增
        </button>
      </form>

      <nav class="filter-bar" aria-label="篩選待辦事項">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </nav>

      <ul class="todo-list" id="todo-list" aria-label="待辦事項"></ul>
      <p class="empty-state" id="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

      <footer class="card-footer">
        <p id="remaining-count" aria-live="polite">未完成:0 項</p>
        <button class="clear-completed-button" id="clear-completed" type="button" aria-label="清除所有已完成的待辦事項" disabled>
          清除已完成
        </button>
      </footer>
    </section>
    <p class="page-note">一件一件來，今天也會有所進展。</p>
  </main>
</body>
</html>
